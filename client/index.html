<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Conteúdo Premium - DIG Site</title>

    <!-- Tipografia: Outfit (limpa) + Bebas Neue (ousada para o timer) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HONEYPOT ANTI-BOT (Oculto e protegido contra preenchimento automático) -->
    <input type="text" id="honeypot" name="website" style="display:none !important" tabindex="-1" autocomplete="new-password" aria-hidden="true">

    <!-- Fundo Animado Azul -->
    <div class="bg-layer" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
        <div class="grain"></div>
    </div>

    <main class="loading-container">
        
        <!-- TELA DE CARREGAMENTO -->
        <div id="loading-area">
            <span class="eyebrow">  &middot; Acesso Restrito</span>

            <!-- Cronômetro + Anel Giratório -->
            <div class="loader-visual">
                <div class="spinner-ring"></div>
                <div class="timer-circle">
                    <span id="countdown-display">3</span>
                </div>
            </div>

            <div class="info-panel">
                <p id="loading-text">Verificando segurança</p>
            </div>
        </div>

        <!-- TELA DE ACESSO LIBERADO (Oculta inicialmente) -->
        <div id="accessible-content" class="hidden">
            <div class="success-icon">✓</div>
            <p id="hint-text">Verificação concluída. Você já pode acessar.</p>
            <a href="#" id="access-button" class="access-button">Entrar no Telegram</a>
        </div>

    </main>

    <!-- DEBUG MOBILE (Eruda) - Apague estas 2 linhas quando terminar os testes -->
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <script src="script.js"></script>
</body>
</html>
